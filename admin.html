<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Fourdots Links</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#0c0c0e;--panel:#141417;--panel2:#1b1b1f;--line:#2a2a30;--text:#f2f2f4;--muted:#9a9aa5;--accent:#c5ff3a;--accent-text:#0c0c0e;--bad:#ff6b6b;--good:#3ddc84}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,sans-serif}
a{color:inherit}button,input,select,textarea{font:inherit;color:inherit}[hidden]{display:none!important}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}textarea{min-height:90px;resize:vertical}
input[type=color]{padding:2px;height:38px;width:52px;flex:none}input[type=checkbox]{width:auto}
label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:0 0 5px}
.f{margin-bottom:12px}.row{display:flex;gap:10px;align-items:flex-end}.row>*{flex:1}.row>.n{flex:none}
.b{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:8px 13px;cursor:pointer;font-weight:600;white-space:nowrap}
.b:hover{border-color:#44444c}.b.p{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}.b.d{color:var(--bad)}.b.s{padding:5px 9px;font-size:12px}
.b[disabled]{opacity:.5;cursor:default}
.hint{font-size:12px;color:var(--muted);margin-top:4px}.k{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);padding:10px 16px;border-radius:10px;z-index:99;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.toast.bad{border-color:var(--bad);color:var(--bad)}
/* login */
#login{min-height:100vh;display:grid;place-items:center;padding:16px}#login .card{width:100%;max-width:360px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px}.brand i{width:26px;height:26px;border-radius:7px;background:var(--accent);display:grid;place-items:center;color:var(--accent-text);font-style:normal;font-size:13px;font-weight:800}
/* app */
header.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);background:rgba(12,12,14,.92);backdrop-filter:blur(8px);flex-wrap:wrap}
header.top select{width:auto;min-width:180px}header.top .sp{flex:1}
nav.tabs{display:flex;gap:4px;padding:10px 16px 0;border-bottom:1px solid var(--line);overflow-x:auto}
nav.tabs button{border:0;background:none;padding:9px 12px;border-bottom:2px solid transparent;color:var(--muted);font-weight:600;cursor:pointer;white-space:nowrap}
nav.tabs button.on{color:var(--text);border-color:var(--accent)}
.main{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:18px;padding:18px 16px;max-width:1280px;margin:0 auto}
.main.full{grid-template-columns:minmax(0,1fr)}
.pv{position:sticky;top:120px;align-self:start}.pv iframe{width:100%;height:calc(100vh - 170px);min-height:560px;border:1px solid var(--line);border-radius:22px;background:#000}
.pv .bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
@media (max-width:1000px){.main{grid-template-columns:minmax(0,1fr)}.pv{display:none}}
.blist{display:flex;flex-direction:column;gap:8px}
.bl{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.bl.off{opacity:.55}.bl .t{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.bl .s{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bl .m{font-size:12px;color:var(--muted)}
.bl .ord{display:flex;flex-direction:column;gap:2px}.bl .ord button{border:0;background:none;color:var(--muted);cursor:pointer;padding:0 4px;line-height:1}
.bl .acts{display:flex;gap:6px;align-items:center}
.ed{background:var(--panel);border:1px solid var(--accent);border-radius:12px;padding:16px;margin:4px 0 8px}
.sub{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;background:var(--bg)}
.hours{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.hours input{padding:7px;font-size:12px}
@media (max-width:700px){.hours{grid-template-columns:repeat(2,1fr)}}
.thumb{width:64px;height:64px;border-radius:8px;object-fit:cover;background:var(--panel2);border:1px solid var(--line);flex:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media (max-width:700px){.grid2{grid-template-columns:1fr}}
table.t{width:100%;border-collapse:collapse;font-size:13px}table.t th,table.t td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}table.t th{color:var(--muted);font-weight:600;font-size:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}.stats .card b{display:block;font-size:28px}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;background:var(--panel2);border:1px solid var(--line)}
.pill.good{color:var(--good);border-color:#24583a}.pill.bad{color:var(--bad);border-color:#5a2a2a}
.add{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
h2{margin:0 0 14px;font-size:18px}h3{margin:18px 0 10px;font-size:14px}
</style>
</head>
<body>
<section id="login" hidden>
  <div class="card">
    <div class="brand" style="margin-bottom:18px"><i>4</i>Fourdots Links</div>
    <form id="lf">
      <div class="f"><label>Email</label><input id="le" type="email" autocomplete="email" required></div>
      <div class="f"><label>Password</label><input id="lp" type="password" autocomplete="current-password" required minlength="8"></div>
      <div id="lerr" class="hint" style="color:var(--bad)" hidden></div>
      <div class="row" style="margin-top:6px"><button class="b p" type="submit">Sign in</button><button class="b n" type="button" id="lnew">First time? Set password</button></div>
      <p class="hint">Only emails added to a client's team can sign in.</p>
    </form>
  </div>
</section>

<section id="app" hidden>
  <header class="top">
    <div class="brand"><i>4</i>Links</div>
    <select id="csel" aria-label="Client"></select>
    <button class="b s" id="newc" hidden>+ New client</button>
    <span class="sp"></span>
    <select id="pday" class="b s" title="Preview the page as it looks on this day" style="width:auto;padding:5px 8px" aria-label="Preview as day"><option value="">Today</option><option value="0">Sunday</option><option value="1">Monday</option><option value="2">Tuesday</option><option value="3">Wednesday</option><option value="4">Thursday</option><option value="5">Friday</option><option value="6">Saturday</option></select><button class="b s" id="pvopen" type="button">Preview ↗</button><a class="b s" id="viewp" target="_blank" rel="noopener">Open page ↗</a>
    <span class="hint" id="who"></span>
    <button class="b s" id="out">Sign out</button>
  </header>
  <nav class="tabs" id="tabs">
    <button data-t="blocks" class="on">Page</button><button data-t="theme">Look</button><button data-t="settings">Settings</button>
    <button data-t="signups">Signups</button><button data-t="stats">Stats</button><button data-t="team">Team</button>
  </nav>
  <div class="main" id="main">
    <div id="view"></div>
    <aside class="pv" id="pv"><div class="bar"><span class="k">Live preview</span><span style="display:flex;gap:6px"><button class="b s" id="rl">Reload</button></span></div><iframe id="frame" title="Preview"></iframe></aside>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/api/config"></script>
<script src="/icons.js"></script>
<script>
(() => {
const CFG = window.LINKS_CFG || {};
const sb = supabase.createClient(CFG.url, CFG.anon);
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const IMG = p => !p ? "" : /^https?:/.test(p) ? p : `${CFG.url}/storage/v1/object/public/links/${p}`;
const toast = (m, bad) => { const t = document.createElement("div"); t.className = "toast" + (bad ? " bad" : ""); t.textContent = m; document.body.append(t); setTimeout(() => t.remove(), bad ? 5000 : 2200); };
const must = r => { if (r.error) throw r.error; return r.data; };
const S = { me: null, client: null, pages: [], page: null, blocks: [], tab: "blocks", open: null };

/* ---------- auth ---------- */
async function boot() {
  const { data } = await sb.auth.getSession();
  if (!data.session) { $("#login").hidden = false; $("#app").hidden = true; return; }
  const me = must(await sb.rpc("whoami"));
  if (!me.admin && !me.clients.length) { await sb.auth.signOut(); $("#lerr").textContent = "This email isn't on any client team yet."; $("#lerr").hidden = false; $("#login").hidden = false; return; }
  S.me = me; $("#login").hidden = true; $("#app").hidden = false; $("#who").textContent = me.email; $("#newc").hidden = !me.admin;
  fillClients(new URLSearchParams(location.search).get("c"));
}
$("#lf").addEventListener("submit", async e => {
  e.preventDefault(); $("#lerr").hidden = true;
  const r = await sb.auth.signInWithPassword({ email: $("#le").value.trim(), password: $("#lp").value });
  if (r.error) { $("#lerr").textContent = /confirm/i.test(r.error.message) ? "This email isn't on a team yet. Ask Fourdots to add you." : "Wrong email or password."; $("#lerr").hidden = false; return; }
  boot();
});
$("#lnew").onclick = async () => {
  $("#lerr").hidden = true;
  const email = $("#le").value.trim(), password = $("#lp").value;
  if (!email || password.length < 8) { $("#lerr").textContent = "Enter your email and a password of 8+ characters, then tap this again."; $("#lerr").hidden = false; return; }
  const r = await sb.auth.signUp({ email, password });
  if (r.error) { $("#lerr").textContent = /registered/i.test(r.error.message) ? "You already have a password. Use Sign in." : r.error.message; $("#lerr").hidden = false; return; }
  if (!r.data.session) { const s = await sb.auth.signInWithPassword({ email, password }); if (s.error) { $("#lerr").textContent = "This email isn't on a team yet. Ask Fourdots to add you."; $("#lerr").hidden = false; return; } }
  boot();
};
$("#out").onclick = async () => { await sb.auth.signOut(); location.reload(); };

/* ---------- clients ---------- */
function fillClients(want) {
  const sel = $("#csel"); sel.innerHTML = S.me.clients.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join("");
  const pick = S.me.clients.find(c => c.slug === want || c.id === want) || S.me.clients[0];
  if (pick) { sel.value = pick.id; loadClient(pick.id); } else $("#view").innerHTML = `<div class="card">No clients yet. Use “New client”.</div>`;
}
$("#csel").onchange = e => loadClient(e.target.value);
$("#newc").onclick = async () => {
  const name = prompt("Client name (e.g. Malleable)"); if (!name) return;
  const slug = name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
  try {
    const c = must(await sb.from("clients").insert({ name, slug, domains: [], theme: {}, settings: { tz: "America/Toronto", default_tag: slug + "-list" } }).select().single());
    must(await sb.from("pages").insert({ client_id: c.id, slug: "", title: "Home" }));
    must(await sb.from("blocks").insert({ client_id: c.id, page_id: (must(await sb.from("pages").select("id").eq("client_id", c.id).eq("slug", "").single())).id, type: "header", sort: 0, data: { title: name } }));
    S.me = must(await sb.rpc("whoami")); fillClients(c.id); toast("Client created");
  } catch (e) { toast(e.message, true); }
};
async function loadClient(id) {
  S.client = must(await sb.from("clients").select("*").eq("id", id).single());
  S.pages = must(await sb.from("pages").select("*").eq("client_id", id).order("sort").order("created_at"));
  S.page = S.pages.find(p => p.slug === "") || S.pages[0] || null;
  history.replaceState(null, "", "?c=" + S.client.slug);
  $("#viewp").href = S.client.domains && S.client.domains[0] && S.client.is_live ? "https://" + S.client.domains[0] : `/c/${S.client.slug}`;
  await loadBlocks(); render();
}
async function loadBlocks() { S.blocks = S.page ? must(await sb.from("blocks").select("*").eq("page_id", S.page.id).order("sort")) : []; }
const previewUrl = () => { const d = $("#pday") ? $("#pday").value : ""; return `/c/${S.client.slug}${S.page && S.page.slug ? "/" + S.page.slug : ""}?t=${Date.now()}${d ? "&day=" + d : ""}`; };
const reload = () => { $("#frame").src = previewUrl(); };
$("#rl").onclick = reload; $("#pday").onchange = reload;
$("#pvopen").onclick = () => window.open(previewUrl(), "_blank");
$$("#tabs button").forEach(b => b.onclick = () => { S.tab = b.dataset.t; $$("#tabs button").forEach(x => x.classList.toggle("on", x === b)); render(); });
function render() {
  $("#main").classList.toggle("full", ["signups", "stats", "team"].includes(S.tab)); $("#pv").hidden = ["signups", "stats", "team"].includes(S.tab);
  ({ blocks: vBlocks, theme: vTheme, settings: vSettings, signups: vSignups, stats: vStats, team: vTeam })[S.tab]();
  if (!$("#pv").hidden) reload();
}

/* ---------- uploads ---------- */
async function shrink(file, max = 1600) {
  if (!/^image\/(jpeg|png|webp)$/.test(file.type)) return file;
  const img = await createImageBitmap(file);
  const scale = Math.min(1, max / Math.max(img.width, img.height));
  if (scale === 1 && file.size < 500e3) return file;
  const c = document.createElement("canvas"); c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  const keepAlpha = file.type === "image/png" && file.size < 400e3 && scale === 1;
  const blob = await new Promise(r => c.toBlob(r, keepAlpha ? "image/png" : "image/webp", 0.82));
  return new File([blob], file.name.replace(/\.\w+$/, keepAlpha ? ".png" : ".webp"), { type: blob.type });
}
async function upload(file, folder = "uploads") {
  const f = file.type.startsWith("image/") ? await shrink(file) : file;
  const path = `${S.client.id}/${folder}/${Date.now().toString(36)}-${f.name.toLowerCase().replace(/[^a-z0-9.]+/g, "-")}`;
  must(await sb.storage.from("links").upload(path, f, { contentType: f.type || "application/octet-stream", cacheControl: "31536000", upsert: false }));
  return path;
}
function imageField(label, val, onPick, accept = "image/*") {
  const w = document.createElement("div"); w.className = "f";
  w.innerHTML = `<label>${esc(label)}</label><div class="row" style="align-items:center">${accept.startsWith("image") ? `<img class="thumb n" ${val ? `src="${esc(IMG(val))}"` : ""}>` : ""}<div><input type="file" accept="${accept}"><div class="hint">${val ? esc(val.split("/").pop()) : "Nothing uploaded"}${accept.startsWith("image") ? " · big images are shrunk automatically" : ""}</div></div>${val ? '<button class="b s d n" type="button">Remove</button>' : ""}</div>`;
  $("input", w).onchange = async e => { const file = e.target.files[0]; if (!file) return; try { $(".hint", w).textContent = "Uploading…"; const p = await upload(file); onPick(p); const t = $("img", w); if (t) t.src = IMG(p); $(".hint", w).textContent = p.split("/").pop(); } catch (er) { toast(er.message, true); } };
  const rm = $(".b.d", w); if (rm) rm.onclick = () => { onPick(""); const t = $("img", w); if (t) t.removeAttribute("src"); $(".hint", w).textContent = "Removed (save to apply)"; };
  return w;
}

/* ---------- block forms ---------- */
const TYPES = {
  header: { n: "Header", sum: d => d.title || d.tagline || "Logo / avatar" },
  heading: { n: "Section title", sum: d => d.text },
  button: { n: "Button", sum: d => d.label },
  card: { n: "Image card", sum: d => d.date_tab || d.title || d.cta },
  booking: { n: "Booking", sum: d => d.label },
  signup: { n: "Text signup", sum: d => d.title },
  locations: { n: "Locations", sum: d => (d.items || []).map(x => x.name).join(" · ") },
  page_link: { n: "Sub-page link", sum: d => d.title },
  text: { n: "Text", sum: d => d.heading || String(d.body || "").slice(0, 60) },
  socials: { n: "Social icons", sum: d => (d.items || []).map(x => x.icon).join(", ") },
};
const ICON_OPTS = Object.keys(window.ICONS || {});
const EVENTS = ["", "Lead", "Schedule", "InitiateCheckout", "Contact", "ViewContent", "FindLocation"];
const ACTION_KINDS = ["reserve", "book", "order", "delivery", "menu", "directions", "call", "gift", "web", "reviews"];
const F = {
  text: (d, k, label, hint, ph) => `<div class="f"><label>${label}</label><input data-k="${k}" value="${esc(d[k])}" ${ph ? `placeholder="${esc(ph)}"` : ""}>${hint ? `<div class="hint">${hint}</div>` : ""}</div>`,
  area: (d, k, label, hint) => `<div class="f"><label>${label}</label><textarea data-k="${k}">${esc(d[k])}</textarea>${hint ? `<div class="hint">${hint}</div>` : ""}</div>`,
  sel: (d, k, label, opts) => `<div class="f"><label>${label}</label><select data-k="${k}">${opts.map(o => { const [v, n] = Array.isArray(o) ? o : [o, o || "(none)"]; return `<option value="${esc(v)}" ${String(d[k] ?? "") === v ? "selected" : ""}>${esc(n)}</option>`; }).join("")}</select></div>`,
  days: (d, k, label, hint) => `<div class="f"><label>${label}</label><div style="display:flex;gap:6px;flex-wrap:wrap">${["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"].map((n, i) => `<label style="display:flex;gap:4px;align-items:center;margin:0;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:5px 8px"><input type="checkbox" data-arr="${k}" value="${i}" ${(d[k] || []).map(Number).includes(i) ? "checked" : ""}>${n}</label>`).join("")}</div>${hint ? `<div class="hint">${hint}</div>` : ""}</div>`,
  locs: (d, k, label, hint) => { const ls = (S.blocks.find(b => b.type === "locations")?.data?.items || []).filter(x => x.name); if (!ls.length) return ""; return `<div class="f"><label>${label}</label><div style="display:flex;gap:6px;flex-wrap:wrap">${ls.map((l, i) => { const key = l.key || String(i); return `<label style="display:flex;gap:4px;align-items:center;margin:0;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:5px 8px"><input type="checkbox" data-arr="${k}" data-str value="${esc(key)}" ${(d[k] || []).includes(key) ? "checked" : ""}>${esc(l.name)}</label>`; }).join("")}</div>${hint ? `<div class="hint">${hint}</div>` : ""}</div>`; },
  chk: (d, k, label) => `<div class="f"><label style="display:flex;gap:8px;align-items:center;color:var(--text)"><input type="checkbox" data-k="${k}" ${d[k] ? "checked" : ""}>${label}</label></div>`,
};
function formFor(b) {
  const d = b.data || {};
  switch (b.type) {
    case "header": return { img: ["image_path", "Logo or photo"], html: F.sel(d, "image_style", "Image style", [["logo", "Logo (as is)"], ["avatar", "Round photo"]]) + F.sel(d, "tint", "Logo colour", [["", "As uploaded"], ["dark", "Make it dark (for light backgrounds)"], ["light", "Make it white (for dark backgrounds)"]]) + F.text(d, "title", "Name (optional if the logo says it)") + F.area(d, "tagline", "Tagline", "Press Enter where you want the line to break.") + F.text(d, "sub", "Small line under it", "Shown in small caps") };
    case "heading": return { html: F.text(d, "text", "Title") };
    case "button": return { img: ["image_path", "Banner image (only for Banner style)"], html: F.text(d, "label", "Label") + F.text(d, "note", "Small line under the label") + F.text(d, "url", "Link", "Full https:// link. Start with / for one of this client's sub-pages.") + `<div class="grid2">${F.sel(d, "style", "Style", [["", "Standard"], ["primary", "Accent colour"], ["banner", "Banner image"]])}${F.sel(d, "icon", "Icon", ["", ...ICON_OPTS])}</div>` + F.sel(d, "event", "Pixel event on tap", EVENTS) };
    case "card": return { img: ["image_path", "Image"], html: F.text(d, "date_tab", "Tab text (bottom left)") + F.text(d, "sub", "Small line in the tab") + `<div class="grid2">${F.text(d, "chip", "Chip (top left)")}${F.text(d, "cta", "Button text", "", "Get tickets")}</div>` + F.text(d, "url", "Link") + `<div class="grid2">${F.sel(d, "event", "Pixel event on tap", EVENTS)}<div>${F.chk(d, "soldout", "Sold out")}</div></div>`
      + `<h3>Days and locations</h3>` + F.days(d, "days", "Only show on", "Leave all unticked to show every day. For a weekly special, tick its day here and in Push to the top.")
      + F.days(d, "feature_days", "Push to the top on", "Moves this card first on those days, ahead of the rest.")
      + F.locs(d, "locs", "Locations", "Cards for the location a visitor picked move ahead of the other location's cards. Leave unticked for both.") };
    case "booking": return { html: F.text(d, "label", "Button label", "", "Book a session") + F.text(d, "note", "Small line under the label") + F.text(d, "url", "Booking link", "Acuity, Calendly, OpenTable, GHL calendar…") + `<div class="grid2">${F.sel(d, "mode", "Opens", [["", "Over the page (sheet)"], ["link", "New tab"]])}${F.sel(d, "style", "Style", [["", "Accent colour"], ["outline", "Standard"]])}</div>` };

    ${F.area(s, "consent_text", "Consent line under the phone field", "Leave blank for the standard wording with the client's name.")}
    <h3>Link tagging (UTM)</h3><div class="grid2"><div class="f"><label style="display:flex;gap:8px;align-items:center;color:var(--text)"><input type="checkbox" id="uon" ${s.utm.enabled === false ? "" : "checked"}>Add UTM tags to outbound links</label></div><div></div>
    <div class="f"><label>utm_source</label><input data-u="source" value="${esc(s.utm.source || "")}" placeholder="instagram"></div><div class="f"><label>utm_medium</label><input data-u="medium" value="${esc(s.utm.medium || "")}" placeholder="social"></div>
    <div class="f"><label>utm_campaign</label><input data-u="campaign" value="${esc(s.utm.campaign || "")}" placeholder="link_in_bio"></div></div>
    <h3>Search and sharing</h3>${F.text(s, "seo_title", "Page title")}${F.area(s, "seo_description", "Description")}
    <div id="simg"></div>${F.chk(s, "hide_footer", "Hide “Made by Fourdots”")}
    <button class="b p" id="ssave">Save settings</button></div>
    <div class="card" style="margin-top:16px" id="ghl"><h2>GoHighLevel</h2><div class="hint">Loading…</div></div>`;
  $("#simg").append(imageField("Favicon (square PNG)", s.favicon_path, p => s.favicon_path = p), imageField("Share image (1200×630)", s.og_image_path, p => s.og_image_path = p));
  $("#ssave").onclick = async () => {
    const box = v.querySelector(".card");
    const u = { name: $("[data-k=name]", box).value.trim(), slug: $("[data-k=slug]", box).value.trim().toLowerCase(), is_live: $("[data-k=is_live]", box).checked,
      domains: $("#sdom").value.split(/[\s,]+/).map(x => x.trim().toLowerCase().replace(/^https?:\/\//, "").replace(/\/.*$/, "")).filter(Boolean) };
    ["default_tag", "pixel_id", "tz", "consent_text", "seo_title", "seo_description"].forEach(k => { const val = $(`[data-k=${k}]`, box).value.trim(); if (val) s[k] = val; else delete s[k]; });
    s.hide_footer = $("[data-k=hide_footer]", box).checked;
    s.utm = { enabled: $("#uon").checked }; $$("[data-u]", box).forEach(el => { if (el.value.trim()) s.utm[el.dataset.u] = el.value.trim(); });
    s.domains_for_utm = u.domains;
    u.settings = s;
    try { S.client = must(await sb.from("clients").update(u).eq("id", c.id).select().single()); S.me = must(await sb.rpc("whoami")); const cur = S.client.id; $("#csel").innerHTML = S.me.clients.map(x => `<option value="${x.id}">${esc(x.name)}</option>`).join(""); $("#csel").value = cur; history.replaceState(null, "", "?c=" + S.client.slug); reload(); toast("Settings saved"); } catch (e) { toast(e.message, true); }
  };
  const g = $("#ghl");
  try {
    const st = must(await sb.rpc("ghl_status", { p_client: c.id })) || {};
    g.innerHTML = `<h2>GoHighLevel</h2><p>${st.connected ? `<span class="pill good">Connected</span> token ending ${esc(st.pit_tail)} · location ${esc(st.location_id || "not set")}` : '<span class="pill bad">Not connected</span> Signups are still saved here and can be exported.'}</p>
      ${S.me.admin ? `<div class="grid2"><div class="f"><label>Private Integration Token</label><input id="gpit" type="password" autocomplete="off" placeholder="${st.connected ? "Leave blank to keep the current token" : "pit-…"}"><div class="hint">Scopes: contacts read/write. Stored server-side; never shown again.</div></div>
      <div class="f"><label>Location ID</label><input id="gloc" value="${esc(st.location_id || "")}"></div></div><button class="b p" id="gsave">Save connection</button>` : '<p class="hint">Only Fourdots admins can change the connection.</p>'}`;
    if ($("#gsave")) $("#gsave").onclick = async () => { try { must(await sb.rpc("set_ghl", { p_client: c.id, p_pit: $("#gpit").value.trim(), p_location: $("#gloc").value.trim() })); toast("GHL connection saved"); vSettings(); } catch (e) { toast(e.message, true); } };
  } catch (e) { g.innerHTML = `<h2>GoHighLevel</h2><p class="hint">${esc(e.message)}</p>`; }
}

/* ---------- signups ---------- */
async function vSignups() {
  const v = $("#view"); v.innerHTML = `<h2>Signups</h2><div class="card hint">Loading…</div>`;
  try {
    const rows = must(await sb.from("signups").select("*").eq("client_id", S.client.id).order("created_at", { ascending: false }).limit(2000));
    v.innerHTML = `<div class="row" style="align-items:center;margin-bottom:12px"><h2 style="margin:0">Signups <span class="hint">(${rows.length})</span></h2><button class="b s n" id="csv">Download CSV</button></div>
      <div class="card" style="padding:0;overflow-x:auto"><table class="t"><tr><th>When</th><th>Phone</th><th>Email</th><th>Name</th><th>Tags</th><th>GHL</th></tr>
      ${rows.map(r => `<tr><td>${new Date(r.created_at).toLocaleString()}</td><td>${esc(r.phone)}</td><td>${esc(r.email || "")}</td><td>${esc(r.first_name || "")}</td><td>${esc((r.tags || []).join(", "))}</td><td><span class="pill ${r.ghl_status === "synced" ? "good" : r.ghl_status === "error" ? "bad" : ""}">${esc(r.ghl_status || "")}</span></td></tr>`).join("") || '<tr><td colspan="6" class="hint">No signups yet.</td></tr>'}</table></div>`;
    $("#csv").onclick = () => {
      const q = x => `"${String(x ?? "").replace(/"/g, '""')}"`;
      const csv = ["created_at,phone,email,first_name,tags,ghl_status", ...rows.map(r => [r.created_at, r.phone, r.email, r.first_name, (r.tags || []).join(" "), r.ghl_status].map(q).join(","))].join("\n");
      const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" })); a.download = `${S.client.slug}-signups.csv`; a.click();
    };
  } catch (e) { v.innerHTML = `<div class="card">${esc(e.message)}</div>`; }
}

/* ---------- stats ---------- */
async function vStats() {
  const v = $("#view"); v.innerHTML = `<h2>Last 30 days</h2><div class="card hint">Loading…</div>`;
  try {
    const s = must(await sb.rpc("client_stats", { p_client: S.client.id, p_days: 30 }));
    const ctr = s.views ? Math.round(s.clicks / s.views * 100) : 0;
    v.innerHTML = `<h2>Last 30 days</h2><div class="stats"><div class="card"><span class="k">Page views</span><b>${s.views}</b></div><div class="card"><span class="k">Taps</span><b>${s.clicks}</b><span class="hint">${ctr}% of views</span></div><div class="card"><span class="k">Signups</span><b>${s.leads}</b></div></div>
      <div class="card" style="padding:0;overflow-x:auto"><table class="t"><tr><th>Most tapped</th><th style="text-align:right">Taps</th></tr>${(s.top || []).map(r => `<tr><td style="word-break:break-all">${esc(String(r.target).replace(/[?&]utm_[^&]+/g, "").replace(/\?$/, ""))}</td><td style="text-align:right">${r.n}</td></tr>`).join("") || '<tr><td colspan="2" class="hint">No taps yet.</td></tr>'}</table></div>`;
  } catch (e) { v.innerHTML = `<h2>Stats</h2><div class="card hint">${esc(e.message)}</div>`; }
}

/* ---------- team ---------- */
async function vTeam() {
  const v = $("#view"); v.innerHTML = `<h2>Team</h2><div class="card hint">Loading…</div>`;
  try {
    const rows = must(await sb.from("team").select("*").eq("client_id", S.client.id).order("added_at"));
    v.innerHTML = `<h2>Team for ${esc(S.client.name)}</h2><div class="card"><p class="hint" style="margin-top:0">People here can edit this client's page and see signups. They sign in at this address with “First time? Set password”. Fourdots admins see every client.</p>
      <table class="t">${rows.map(r => `<tr><td>${esc(r.email)}</td><td style="text-align:right"><button class="b s d" data-rm="${r.id}">Remove</button></td></tr>`).join("") || '<tr><td class="hint">Nobody yet.</td></tr>'}</table>
      <div class="row" style="margin-top:14px"><input id="temail" type="email" placeholder="name@client.com"><button class="b p n" id="tadd">Add</button></div></div>`;
    $("#tadd").onclick = async () => { const email = $("#temail").value.trim().toLowerCase(); if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return toast("Enter an email", true); try { must(await sb.from("team").insert({ client_id: S.client.id, email, role: "editor" })); vTeam(); toast("Added"); } catch (e) { toast(e.message, true); } };
    $$("[data-rm]", v).forEach(b => b.onclick = async () => { if (!confirm("Remove this person?")) return; try { must(await sb.from("team").delete().eq("id", b.dataset.rm)); vTeam(); } catch (e) { toast(e.message, true); } });
  } catch (e) { v.innerHTML = `<div class="card">${esc(e.message)}</div>`; }
}

sb.auth.onAuthStateChange(ev => { if (ev === "SIGNED_OUT") { $("#app").hidden = true; $("#login").hidden = false; } });
boot().catch(e => toast(e.message, true));
})();
</script>
</body>
</html>
